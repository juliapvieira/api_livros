<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVROS 📚</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>LIVROS</h1>
        <p class="subtitle">API sobre livros e gêneros</p>

        <div class="book-area">
            <img src="" alt="Capa do livro" id="bookImage">
            <div id="bookName"></div>
        </div>

        <div class="controls">
            <button id="randomBtn">🎲 Livro aleatório</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="bookInput"
                placeholder="Digite um gênero (ex: romance, terror, suspense, infantil...)"
            >
            <button id="searchBtn">🔍 Buscar</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
